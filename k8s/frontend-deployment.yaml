apiVersion: apps/v1
kind: Deployment
metadata:
  name: vjctai-frontend
  labels:
    app: vjctai-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vjctai-frontend
  template:
    metadata:
      labels:
        app: vjctai-frontend
    spec:
      containers:
      - name: frontend
        image: vjctai/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vjctai-frontend-service
spec:
  selector:
    app: vjctai-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
