apiVersion: apps/v1
kind: Deployment
metadata:
  name: vjctai-backend
  labels:
    app: vjctai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vjctai-backend
  template:
    metadata:
      labels:
        app: vjctai-backend
    spec:
      containers:
      - name: backend
        image: vjctai/backend:latest
        ports:
        - containerPort: 4000
        env:
        - name: PORT
          value: "4000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vjctai-secrets
              key: jwt-secret
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vjctai-secrets
              key: openai-api-key
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: vjctai-backend-service
spec:
  selector:
    app: vjctai-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
